---
permalink: /drawings/
title: "Drawings"
layout: single
author_profile: true
---

<div class="drawings-intro">
  <p>
    Some things I drew along the way.
  </p>
</div>

{% for section in site.data.drawings.sections %}

<section class="drawings-section">

  <h2>{{ section.name }}</h2>

  <div class="drawings-grid">

    {% for item in section.items %}

    <figure class="drawing-item">

      <a
        href="{{ item.image | relative_url }}"
        target="_blank"
        rel="noopener"
      >
        <img
          src="{{ item.image | relative_url }}"
          alt="{{ item.title | default: section.name }}"
          loading="lazy"
        >
      </a>

      {% if item.title %}
      <figcaption>
        {{ item.title }}
      </figcaption>
      {% endif %}

    </figure>

    {% endfor %}

  </div>

</section>

{% endfor %}
