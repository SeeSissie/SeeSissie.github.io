          - 肥牛卷
          - 生食鸡蛋

      - name: "香烤杂蔬"
        image: "/images/kitchen/roastVegetables.jpg"
        ingredients:
          - 各种蔬菜

      - name: "香煎三文鱼"
        image: "/images/kitchen/salmon.jpg"
        ingredients:
          - 三文鱼
          - 黄油


  - name: "🎂 Desserts"
    items:
      - name: "巴斯克"
        image: "/images/kitchen/basque.jpg"
        ingredients:
          - 奶油奶酪
          - 淡奶油
          - 鸡蛋
          - 面粉
          - 糖

      - name: "莓莓饼干"
        image: "/images/kitchen/butterBiscuit.jpg"
        ingredients:
          - 黄油
          - 糖
          - 鸡蛋
          - 面粉
          - 蓝莓干/蔓越莓干

      - name: "柠檬磅蛋糕"
        image: "/images/kitchen/poundCake.jpg"
        ingredients:
          - 黄油
          - 糖
          - 鸡蛋
          - 面粉
          - 柠檬
      
  - name: "🥤 Coffee"
    items:
      - name: "经典拿铁 （热）"
        image: "/images/kitchen/latteClassic.jpg"
        ingredients:
          - 浓缩咖啡
