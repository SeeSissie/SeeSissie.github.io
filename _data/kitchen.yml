sections:
  - name: "🍚 主食"
    items:
      - name: "番茄意面"
        image: "/images/kitchen/spaghettiTomato.jpg"
        ingredients:
          - 意面
          - 番茄意面酱
          - 香煎鸡胸
          - 芝士片
          
      - name: "罗勒意面"
        image: "/images/kitchen/spaghetti.jpg"
