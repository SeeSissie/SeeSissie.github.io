          - 意面
          - 罗勒青酱
          - 香煎鸡胸
          - 芝士片

      - name: "鳗鱼饭"
        image: "/images/kitchen/unadon.jpg"
        ingredients:
          - 蒲烧鳗鱼
          - 白米饭
          - 煎鸡蛋
          - 拌海草
          
      - name: "咖喱饭"
        image: "/images/kitchen/curry.jpg"
        ingredients:
          - 咖喱
          - 土豆
          - 胡萝卜
          - 彩椒
          - 肥牛卷
          - 白米饭
          - 牛奶

      - name: "三明治"
        image: "/images/kitchen/sandwich.jpg"
        ingredients:
          - 恰巴塔
          - 芝麻菜
          - 奶油奶酪
          - 罗勒青酱
          - 彩椒
          - 帕雀斯牛肉片

      - name: "寿喜锅"
        image: "/images/kitchen/sukiyaki.jpg"
        ingredients:
          - 寿喜烧汁
          - 嫩豆腐
          - 胡萝卜
          - 洋葱
          - 娃娃菜
